<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>City Surf Web</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111823">
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #0b0e13;
  touch-action: none;
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    if (typeof r !== "number") r = 10;
    this.moveTo(x + r, y);
    this.arcTo(x + w, y, x + w, y + h, r);
    this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r);
    this.arcTo(x, y, x + w, y, r);
    this.closePath();
    return this;
  };
}

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = 0;
let H = 0;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;

  canvas.width = Math.floor(W * dpr);
  canvas.height = Math.floor(H * dpr);
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener("resize", resize);
resize();

const LANES = 5;

const state = {
  over: false,
  started: false,
  lane: 2,
  playerX: 0,
  jump: 0,
  speed: 280,
  dist: 0,
  time: 0,
  spawnTimer: 0.8,
  obstacles: [],
  touchX: 0,
  touchY: 0
};

function laneX(i) {
  const margin = W * 0.08;
  const usable = W - margin * 2;
  return margin + usable * (i / (LANES - 1));
}

function laneWidth() {
  return Math.min(W * 0.15, 90);
}

function playerW() {
  return laneWidth() * 0.45;
}

function playerH() {
  return laneWidth() * 0.75;
}

function reset() {
  state.over = false;
  state.started = true;
  state.lane = 2;
  state.playerX = laneX(2);
  state.jump = 0;
  state.speed = 280;
  state.dist = 0;
  state.time = 0;
  state.spawnTimer = 0.8;
  state.obstacles.length = 0;
}

function spawnObstacle(lane) {
  const y = -80;
  const w = laneWidth() * 0.82;
  const h = 26 + Math.random() * 18;

  state.obstacles.push({
    lane,
    y,
    w,
    h
  });
}

function spawnPattern() {
  const r = Math.random();

  if (r < 0.28) {
    for (let lane = 1; lane <= 3; lane++) {
      if (Math.random() < 0.9) {
        spawnObstacle(lane);
      }
    }
  } else if (r < 0.48) {
    spawnObstacle(Math.random() < 0.5 ? 0 : 4);
    spawnObstacle(1 + Math.floor(Math.random() * 3));
  } else {
    const n = 1 + Math.floor(Math.random() * 2);
    for (let i = 0; i < n; i++) {
      spawnObstacle(Math.floor(Math.random() * LANES));
    }
  }
}

function moveLane(dir) {
  if (state.over || !state.started) return;
  state.lane = Math.max(0, Math.min(LANES - 1, state.lane + dir));
}

function jump() {
  if (state.over || !state.started) return;
  if (state.jump <= 0) state.jump = 0.72;
}

function update(dt) {
  if (!state.started || state.over) return;

  state.time += dt;
  state.speed += 9 * dt;
  state.dist += state.speed * dt / 50;

  state.spawnTimer -= dt;
  if (state.spawnTimer <= 0) {
    spawnPattern();
    const base = Math.max(0.42, 1.15 - state.speed / 900);
    state.spawnTimer = base * (0.8 + Math.random() * 0.4);
  }

  if (state.jump > 0) state.jump -= dt;

  const targetX = laneX(state.lane);
  state.playerX += (targetX - state.playerX) * Math.min(1, 14 * dt);

  const py = H - 130;
  const ph = playerH();
  const pw = playerW();

  const playerTop = py - ph / 2 - (state.jump > 0 ? 34 : 0);
  const playerBottom = playerTop + ph;

  for (let i = state.obstacles.length - 1; i >= 0; i--) {
    const o = state.obstacles[i];
    o.y += state.speed * dt;

    if (o.y > H + 100) {
      state.obstacles.splice(i, 1);
      continue;
    }

    if (state.jump <= 0 && o.lane === state.lane) {
      const ox = laneX(o.lane);

      if (Math.abs(state.playerX - ox) < (pw + o.w) * 0.42) {
        const obstacleTop = o.y - o.h / 2;
        const obstacleBottom = o.y + o.h / 2;

        if (playerBottom > obstacleTop && playerTop < obstacleBottom) {
          state.over = true;
        }
      }
    }
  }
}

function drawBackground() {
  ctx.fillStyle = "#111823";
  ctx.fillRect(0, 0, W, H);

  const lw = laneWidth();

  const roadLeft = laneX(1) - lw * 0.7;
  const roadRight = laneX(3) + lw * 0.7;

  ctx.fillStyle = "#20242c";
  ctx.fillRect(roadLeft, 0, roadRight - roadLeft, H);

  ctx.fillStyle = "#4a3325";
  ctx.fillRect(0, 0, laneX(0) + lw * 0.55, H);

  ctx.fillStyle = "#263a5b";
  ctx.fillRect(laneX(4) - lw * 0.55, 0, W, H);

  const off = (state.dist * 50) % 90;

  ctx.strokeStyle = "rgba(255,255,255,0.14)";
  ctx.lineWidth = 3;

  for (let lane = 1; lane <= 3; lane++) {
    const x = laneX(lane);

    ctx.setLineDash([28, 62]);
    ctx.lineDashOffset = -off;

    ctx.beginPath();
    ctx.moveTo(x, -20);
    ctx.lineTo(x, H + 20);
    ctx.stroke();
  }

  ctx.setLineDash([]);
}

function drawObstacles() {
  for (const o of state.obstacles) {
    const x = laneX(o.lane);

    ctx.fillStyle = o.lane === 0 || o.lane === 4 ? "#ff7b42" : "#ff3b3b";

    ctx.beginPath();
    ctx.roundRect(x - o.w / 2, o.y - o.h / 2, o.w, o.h, 10);
    ctx.fill();
  }
}

function drawPlayer() {
  const py = H - 130;
  const pw = playerW();
  const ph = playerH();
  const isJumping = state.jump > 0;
  const y = py - (isJumping ? 34 : 0);

  ctx.fillStyle = "rgba(0,0,0,0.35)";
  ctx.beginPath();
  ctx.ellipse(state.playerX, py + ph * 0.55, pw * 0.55, 10, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = isJumping ? "#8df0ff" : "#41d7ff";
  ctx.beginPath();
  ctx.roundRect(state.playerX - pw / 2, y - ph / 2, pw, ph, 12);
  ctx.fill();

  ctx.fillStyle = "#083744";
  ctx.fillRect(state.playerX - pw * 0.18, y - ph * 0.22, pw * 0.36, ph * 0.16);
}

function drawHUD() {
  ctx.fillStyle = "rgba(0,0,0,0.25)";
  ctx.beginPath();
  ctx.roundRect(12, 12, 320, 86, 14);
  ctx.fill();

  ctx.fillStyle = "#fff";
  ctx.font = "20px sans-serif";
  ctx.fillText(`Дистанция: ${Math.floor(state.dist)} м`, 24, 40);

  ctx.font = "14px sans-serif";
  ctx.fillText("Свайп/стрелки: влево, вправо; вверх — прыжок", 24, 64);
  ctx.fillText("На крышу: до упора влево/вправо", 24, 84);

  if (!state.started) {
    drawCenterPanel(
      "City Surf",
      "Нажми, чтобы начать\nУправление: тап/свайп или клавиши"
    );
  }

  if (state.over) {
    drawCenterPanel(
      "Столкновение!",
      `Дистанция: ${Math.floor(state.dist)} м\nНажми, чтобы начать заново`
    );
  }
}

function drawCenterPanel(title, text) {
  ctx.fillStyle = "rgba(0,0,0,0.55)";
  ctx.fillRect(0, 0, W, H);

  const lines = text.split("\n");

  ctx.fillStyle = "#fff";
  ctx.textAlign = "center";

  ctx.font = "bold 36px sans-serif";
  ctx.fillText(title, W / 2, H / 2 - 40);

  ctx.font = "20px sans-serif";

  lines.forEach((line, i) => {
    ctx.fillText(line, W / 2, H / 2 + i * 28);
  });

  ctx.textAlign = "left";
}

let last = performance.now();

function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;

  update(dt);

  drawBackground();
  drawObstacles();
  drawPlayer();
  drawHUD();

  requestAnimationFrame(loop);
}

window.addEventListener("keydown", (e) => {
  const keys = [
    "ArrowLeft",
    "ArrowRight",
    "ArrowUp",
    "ArrowDown",
    "a",
    "A",
    "w",
    "W",
    "s",
    "S",
    "d",
    "D",
    "ф",
    "Ф",
    "ц",
    "Ц",
    "ы",
    "Ы",
    "в",
    "В",
    " ",
    "Enter"
  ];

  if (keys.includes(e.key)) {
    e.preventDefault();
  }

  if (["ArrowLeft", "a", "A", "ф", "Ф"].includes(e.key)) {
    moveLane(-1);
  } else if (["ArrowRight", "d", "D", "в", "В"].includes(e.key)) {
    moveLane(1);
  } else if (["ArrowUp", "w", "W", "ц", "Ц", " "].includes(e.key)) {
    if (!state.started || state.over) {
      reset();
    } else {
      jump();
    }
  } else if (["ArrowDown", "s", "S", "ы", "Ы"].includes(e.key)) {
    if (state.lane === 0) moveLane(1);
    else if (state.lane === 4) moveLane(-1);
  } else if (e.key === "Enter") {
    if (!state.started || state.over) reset();
  }
});

canvas.addEventListener("touchstart", (e) => {
  e.preventDefault();

  const t = e.changedTouches[0];
  state.touchX = t.clientX;
  state.touchY = t.clientY;

  if (!state.started || state.over) {
    reset();
  }
}, { passive: false });

canvas.addEventListener("touchend", (e) => {
  e.preventDefault();

  if (!state.started || state.over) return;

  const t = e.changedTouches[0];
  const dx = t.clientX - state.touchX;
  const dy = t.clientY - state.touchY;

  if (Math.abs(dx) > Math.abs(dy)) {
    if (Math.abs(dx) > 24) {
      moveLane(dx > 0 ? 1 : -1);
    }
  } else {
    if (dy < -24) {
      jump();
    }

    if (dy > 24) {
      if (state.lane === 0) moveLane(1);
      if (state.lane === 4) moveLane(-1);
    }
  }
}, { passive: false });

canvas.addEventListener("mousedown", () => {
  if (!state.started || state.over) {
    reset();
  } else {
    jump();
  }
});

state.playerX = laneX(2);
requestAnimationFrame(loop);
</script>
</body>
</html>
